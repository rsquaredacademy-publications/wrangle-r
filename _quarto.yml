project:
  type: book
  output-dir: docs
  # sitemap.xml is deliberately NOT a resource: it is generated after the HTML
  # render by scripts/make-sitemap.sh, so there is no root copy to copy in.
  resources:
    - "data-webr/*.csv"
    - "robots.txt"
    - "netlify.toml"
    - "google02e424888b5e2def.html"
    - "404.html"
    - site-kit

quarto-required: ">=1.6.0"

sitemap: true

book:
  title: "Data Wrangling with R"
  author: "Aravind Hebbali"
  date: last-modified
  description: "R for Data Science teaches the whole game. Data Wrangling with R drills the hardest 20%: joins, grouped summaries, messy strings, datetimes, and factors — on one realistic ecommerce dataset, runnable in your browser."
  chapters:
    - index.qmd
    - 00-author.qmd
    - 01-import-1.qmd
    - 02-import-2.qmd
    - 03-pipes.qmd
    - 04-dplyr-1.qmd
    - 05-dplyr-2.qmd
    - 06-dplyr-3.qmd
    - 07-tibbles.qmd
    - 08-tidyr.qmd
    - 09-stringr.qmd
    - 10-lubridate-parsing.qmd
    - 11-lubridate-arithmetic.qmd
    - 12-factors-fundamentals.qmd
    - 13-forcats-manipulation.qmd
    - 14-solutions.qmd
  appendices:
    - appendices/arrow-duckdb.qmd
    - appendices/legacy-magrittr.qmd
    - appendices/rosetta-pandas.qmd
  downloads: [pdf, epub]
  page-footer:
    center: |
      We use Google Analytics 4 to understand how people use this site (pages visited, referring sites, device type and approximate location) so we can improve our free learning material. Google Analytics uses cookies and a pseudonymous identifier; we don't use it for advertising and we never send Google names or email addresses. Visitors in the European Economic Area, the United Kingdom and Switzerland are asked for consent first, and if they decline, no analytics cookies are stored. Anyone can switch analytics off at any time: <a href="#" data-rsa-analytics-optout>Turn off analytics</a>.

      Sites that show the newsletter sign-up form use Zoho Campaigns to send updates. If you sign up, we collect your email address, an optional first name, and which site you signed up on, and we use them only to send you updates. Sign-up uses double opt-in, so you must confirm by email before you are added; every email includes an unsubscribe link, and we never sell or share the list.

website:
  site-url: https://wrangle-r.rsquaredacademy.com
  description: "R for Data Science teaches the whole game. Data Wrangling with R drills the hardest 20%: joins, grouped summaries, messy strings, datetimes, and factors — on one realistic ecommerce dataset, runnable in your browser."
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/rsquaredacademy-publications/wrangle-r
  navbar:
    right:
      - text: "GitHub"
        href: https://github.com/rsquaredacademy-publications/wrangle-r

execute:
  freeze: auto
  warning: false

format:
  html:
    # Interactive R cells via WebAssembly (coatless/webr), scoped to HTML:
    # the webr lua filter rewrites the AST and breaks Typst callouts in PDF.
    filters:
      - webr
      - includes/rsa-signup.lua
    theme:
      light: flatly
      dark: darkly
    toc-depth: 3
    search: true
    code-copy: true
    code-tools: true
    code-overflow: wrap
    fig-align: center
    fig-dpi: 192
    include-in-header:
      - includes/head.html
      - includes/site-kit-head.html
  pdf:
    # lualatex (not typst): callouts need tcolorbox, which the Typst
    # template cannot provide (same call as viz-ggplot2).
    pdf-engine: lualatex
    papersize: us-letter
    toc-depth: 3
    code-overflow: wrap
    fig-format: png
    fig-dpi: 300
  epub:
    toc-depth: 2
    code-overflow: wrap

language:
  search:
    placeholder: "Search verbs, e.g. semi_join vs anti_join"
