name: Link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in built site
        uses: lycheeverse/lychee-action@v2
        with:
          # Exclude hosts that answer 403 to bots (mailto:, reddit.com, stackoverflow.com, community.posit.co); --root-dir resolves root-relative links such as /site-kit/rsa-analytics.js.
          args: --verbose --no-progress --root-dir '${{ github.workspace }}/docs' './docs/**/*.html' --exclude 'mailto:' --exclude 'reddit\.com' --exclude 'stackoverflow\.com' --exclude 'community\.posit\.co'
          fail: true
